<!DOCTYPE html>
<html lang = "ru">
    <head>
        <meta charset="UTF-8">
        <title>Churn Predictor</title>
        <style>
            body {font-family:'Trebuchet MS', 'Lucida Sans Unicode', 'Lucida Grande', 'Lucida Sans', Arial, sans-serif;
        max-width: 500px; margin: 40px auto;}
            label {display: block; margin-top: 10px}
            input, select {width: 100%; padding: 6px}
            button {margin-top: 20px; padding: 10px 20px;}
            #result {margin-top: 20px; padding: 15px; border-radius: 8px; 
            font-weight:bold;}

        </style>
    </head>
    <body>
        <h2>Прогноз оттока клиента</h2>
        <form id="churnForm">
        <label> Tenure(мес.)</label>
        <input type="number" name="tenure" value="12" required>

        <label>Monthly Charges</label>
        <input type="number" step="0.01" name="MonthlyCharges" value="70.5" required>

        <label>Contract</label>
        <select name="Contract">
            <option>Month-to-month</option>
            <option>One year</option>
            <option>Two year</option>
        </select>

        <label>Internet Service</label>
        <select name="InternetService">
            <option>DSL</option>
            <option>Fiber optic</option>
            <option>No</option>
        </select>

        <button type="submit">Предсказать</button>           
        </form>
        <div id="result"></div>
        <script src="/static/script.js">
        </script>
        </body>
</html>
